<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador Lotería</title>
<style>body{font-family:Arial;margin:0;background:#f4f6fa;color:#17324d}header{background:#126bb0;color:#fff;padding:18px}main{max-width:1200px;margin:auto;padding:16px}section{background:#fff;padding:16px;border-radius:12px;margin-bottom:16px}button,input,select{padding:9px;border-radius:7px;border:1px solid #bbb}button{background:#126bb0;color:#fff;font-weight:bold;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;max-height:500px;overflow:auto}.c{border:1px solid #ddd;padding:8px;border-radius:8px}.boards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.board{border:4px solid #ffe000;padding:7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.tile{min-height:80px;border:1px solid #999;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px}@media print{.edit{display:none}}</style></head>
<body><header><h1>🎴 Generador de Lotería — 54 cartas</h1></header><main>
<section class="edit"><h2>Generar</h2>Cartones <input id="qty" type="number" min="1" max="100" value="8"> &nbsp; Usar favoritas <select id="use"><option value="yes">Sí</option><option value="no">No</option></select> &nbsp; Favoritas por cartón <input id="fc" type="number" min="0" max="16" value="4"> <button id="go">🎴 GENERAR CARTONES</button> <button onclick="window.print()">📄 PDF / Imprimir</button><p id="msg"></p></section>
<section class="edit"><h2>⭐ Escoge tus favoritas</h2><div id="cards" class="cards"></div></section>
<section><h2>Vista previa</h2><div id="boards" class="boards"></div></section></main>
<script>
const names=["El Gallo", "El Diablito", "La Dama", "El Catrín", "El Paraguas", "La Sirena", "La Escalera", "La Botella", "El Barril", "El Árbol", "El Melón", "El Valiente", "El Gorrito", "La Muerte", "La Pera", "La Bandera", "El Bandolón", "El Violoncello", "La Garza", "El Pájaro", "La Mano", "La Bota", "La Luna", "El Cotorro", "El Borracho", "El Negrito", "El Corazón", "La Sandía", "El Tambor", "El Camarón", "Las Jaras", "El Músico", "La Araña", "El Soldado", "La Estrella", "El Cazo", "El Mundo", "El Apache", "El Nopal", "El Alacrán", "La Rosa", "La Calavera", "La Campana", "El Cantarito", "El Venado", "El Sol", "La Corona", "La Chalupa", "El Pino", "El Pescado", "La Palma", "La Maceta", "El Arpa", "La Rana"];
const cards=names.map((name,id)=>({name,id,fav:false}));
function draw(){const e=document.getElementById("cards");e.innerHTML="";cards.forEach(c=>{let d=document.createElement("div");d.className="c";d.innerHTML="<b>"+(c.id+1)+". "+c.name+"</b><br><label><input type='checkbox'> ⭐ Favorita</label>";d.querySelector("input").onchange=x=>c.fav=x.target.checked;e.appendChild(d)})}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(){let q=Math.max(1,Math.min(100,+document.getElementById("qty").value||8)),use=document.getElementById("use").value=="yes",fc=Math.max(0,Math.min(16,+document.getElementById("fc").value||0)),fav=cards.filter(c=>c.fav),out=document.getElementById("boards");out.innerHTML="";for(let n=0;n<q;n++){let chosen=use?shuffle(fav.slice()).slice(0,Math.min(fc,fav.length)).map(c=>c.id):[],rest=shuffle(cards.map(c=>c.id).filter(id=>!chosen.includes(id)));chosen=shuffle(chosen.concat(rest.slice(0,16-chosen.length)));let b=document.createElement("div");b.className="board";b.innerHTML="<h3>Tabla "+(n+1)+"</h3>";let g=document.createElement("div");g.className="grid";chosen.forEach(id=>{let t=document.createElement("div");t.className="tile";t.textContent=cards[id].name+(cards[id].fav?" ⭐":"");g.appendChild(t)});b.appendChild(g);out.appendChild(b)}document.getElementById("msg").textContent=q+" cartones generados correctamente."}
document.getElementById("go").onclick=generate;draw();generate();
</script></body></html>
